# The decision 35 carve-out for the public-export names scan (plan.md section 4 item 11).
#
# tools/check_public_export.py runs tools/check_names.py over the rebuilt public tree and reads
# this record from HEAD (never from the work tree, so an uncommitted edit cannot change a
# verdict). A denylist finding is covered only as the entry for its file records it. An entry
# with a lines list of [line, sha256] pairs covers findings only on those exact lines, whatever
# their number, and pins each listed line's content: the SHA-256 of the line's bytes at HEAD (the
# lines split at each LF only, the LF not part of the line, as the scan splits them). The gate
# compares every content pin with the committed bytes on every run that reaches the comparison, in
# both modes and whether or not the scan reports a finding, and records each mismatch before the
# names scan runs, so a run whose names scan cannot evaluate still names it above its CANNOT
# EVALUATE error; a run that cannot evaluate earlier (a malformed record or skip list, an export
# that does not build, or a git failure) compares nothing. No run passes unless every content pin
# matches, so any edit to a listed line, and a listed line the file no longer has, keeps the gate
# from passing until the line is deliberately re-pinned. An entry with a matches list of
# [denylist entry, count] pairs covers findings anywhere in its file, and the gate fails unless
# each pinned denylist entry is reported exactly its pinned number of times and no unpinned
# denylist entry is reported in that file at all.
#
# Exactly this is caught: a finding in a file no entry names; a finding on a line a lines entry
# does not list; any change to the bytes of a listed line (so a name added to a listed line fails,
# whatever denylist entry it matches, and so does a same-line swap between denylist entries); a
# per-denylist-entry count above or below a matches pin and any finding of an unpinned denylist
# entry (so a single swap to an unpinned denylist entry, or one that changes a pinned entry's
# count, fails); a path that matches the denylist; and the email and home-directory checks.
# Exactly this is not caught. Under lines, nothing on a listed line can change without failing;
# since a finding on a listed line is covered whatever its number, a change of the denylist
# itself that changes the findings on an unchanged listed line passes. Under matches, the gate
# does not catch any change that keeps every pinned denylist entry's count in the file and adds
# no unpinned entry, including moving a finding to another line, replacing a name with other text
# matching the same entry, and reciprocal swaps between pinned entries; since the scan reports one
# finding per (line, denylist entry) however often an entry matches within one line, another
# match of an entry already reported on that line keeps the count too. Those changes rest on
# review of edits to covered files. The match count pins are compared only when the scan reports
# a finding: a scan that reports no finding at all leaves every count pin unchecked (the content
# pins are still compared); that residual is accepted, since it means nothing forbidden would be
# published.
#
# Use lines where the file is hand-edited and its line numbers are stable; use matches for a
# generated file whose line numbers churn (the d4-footer pages and the licence page source), and
# re-pin deliberately when the functional content changes. Keep an entry only while every covered
# match in its file is one of the recorded functional names, and record the class and the anchors
# in its reason.
#
# Pin provenance: each line content pin below is the SHA-256 of that line's committed bytes,
# computed from the commit that introduced the content pins, and the gate checks every one on
# every run. The per-entry match pins carry denylist entry 1 with the previously recorded totals,
# placeholders rather than observations, because no local denylist was available to observe the
# real (line, denylist entry) findings when this format landed; whether they match the real
# denylist is unknown. A wrong match pin fails the gate whenever the scan reports any finding, and
# the gate's mismatch output names the file, the denylist entry, the observed count and the pin,
# so the first full local gate run that reports a finding reports every mismatch, and the
# maintainer re-pins the record from that output. On the maintainer's host the full gate run
# reports no names-scan finding, so the match pins (and which listed lines carry a finding) are
# not exercised there; only the content pins are. Re-pin from an observed local run that reports
# findings before relying on the match pins.
#
# Classes: "d4-footer" (the footer tiles and signature every generated page carries,
# inputs/decisions.md decision 32 D4), "security-contact" (the published security contact and the
# policy links), "digest-anchor" (the release digest anchor the adopt tooling hard-codes),
# "repository-link" (links to the maintainer's repositories, including the pinned source URLs that
# plan.md section 4 item 14 retargets at the first release export), and "attribution" (the
# authorship and trademark wording kept verbatim, the reasoning recorded in NOTICE).

